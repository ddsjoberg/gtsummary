name: Performance Benchmark
on:
  pull_request:
    branches: [main, master]

jobs:
  # GitHub expressions have no trim(), so the `perf` title check runs in a
  # lightweight shell job whose output gates the benchmark below. This keeps a
  # stray leading space in the PR title from silently skipping the benchmark.
  check-title:
    runs-on: ubuntu-latest
    outputs:
      run-benchmark: ${{ steps.check.outputs.run-benchmark }}
    steps:
      - name: Check for `perf` title prefix
        id: check
        # The title is passed via env rather than interpolated into the script
        # so that its contents are never evaluated as shell.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          title="$(printf '%s' "$PR_TITLE" | sed -e 's/^[[:space:]]*//')"
          if [ "${title#perf}" != "$title" ]; then
            echo "run-benchmark=true" >> "$GITHUB_OUTPUT"
          else
            echo "run-benchmark=false" >> "$GITHUB_OUTPUT"
          fi

  benchmark:
    needs: check-title
    if: needs.check-title.outputs.run-benchmark == 'true'
    runs-on: ubuntu-latest
    # rocker/r-ver builds R with `--enable-memory-profiling`, which the default
    # r-lib/actions/setup-r Linux binary lacks. Without it bench::mark()'s
    # mem_alloc is NA and the memory columns cannot be populated. `latest` tracks
    # the newest R release; main and PR are built in the same container each run,
    # so they always compare on identical R.
    container: rocker/r-ver:latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      pull-requests: write
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      # R is already installed in the rocker container (with memory profiling),
      # so the setup-r step is intentionally omitted.

      - name: Install Dependencies & Cache
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::bench
            any::knitr
            any::gert
            any::pak
            any::broom
            any::pkgload
            any::flextable
            any::huxtable
            any::kableExtra
          cache: true
          cache-version: 3

      - name: Run Benchmarks
        run: Rscript .github/scripts/benchmark.R

      - name: Post Comment
        uses: mshick/add-pr-comment@v3
        with:
          message-path: bench_report.md
          message-id: 'add-benchmark-pr-comment'
